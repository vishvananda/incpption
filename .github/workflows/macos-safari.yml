name: Real Safari
on:
  workflow_dispatch:
    inputs:
      origin:
        description: Published site URL to test
        type: string
        default: https://incpption.com
        required: true
      workers:
        description: Total compile workers
        type: choice
        options: ['8', '4', '2']
        default: '2'
      compare_origin:
        description: Optional second URL for an A/B/B/A comparison on the same Mac
        type: string
        default: ''
      calibrate:
        description: Run baseline calibration and warm both URLs before A/B/B/A
        type: boolean
        default: false
      execution:
        description: Worker execution or diagnostic page-stack probe
        type: choice
        options: ['worker', 'main-thread-probe']
        default: worker
      mode:
        description: Full journey or comparison timing only
        type: choice
        options: ['full', 'comparison']
        default: full
      profile:
        description: Sample WebKit CPU stacks during large source compilation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo /usr/bin/safaridriver --enable
      - run: python3 tests/macos_safari_test.py
        if: inputs.compare_origin == ''
        env:
          SAFARI_TEST_ORIGIN: ${{ inputs.origin }}
          SAFARI_TEST_WORKERS: ${{ inputs.workers }}
          SAFARI_TEST_EXECUTION: ${{ inputs.execution }}
          SAFARI_TEST_MODE: ${{ inputs.mode }}
          SAFARI_TEST_PROFILE: ${{ inputs.profile }}
      - run: python3 tests/macos_safari_compare.py
        if: inputs.compare_origin != ''
        env:
          SAFARI_TEST_ORIGIN: ${{ inputs.origin }}
          SAFARI_COMPARE_ORIGIN: ${{ inputs.compare_origin }}
          SAFARI_TEST_WORKERS: ${{ inputs.workers }}
          SAFARI_COMPARE_CALIBRATE: ${{ inputs.calibrate }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-safari-results
          path: build/macos-safari
          retention-days: 7
