name: Browser demo
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/macos-safari.yml'
      - 'tests/macos_safari_*.py'
      - 'tests/compile_events.js'
  pull_request:
  workflow_dispatch:
    inputs:
      clang_roundtrip:
        description: Build clang and verify the complete optional compiler round trip
        type: boolean
        default: false
      all_projects:
        description: Compile all three projects with both compilers and open each output
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: browser-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - run: node tests/highlight_test.mjs
      - run: npm run test:workflow
      - run: npm run test:transport
      - run: python3 tests/seed_transport_test.py
      - run: python3 tests/reference_names_test.py
      - run: python3 tests/project_sources_test.py
      - run: python3 tests/llvm_profile_test.py
      - run: python3 tests/translation_profile_test.py
      - uses: actions/cache@v4
        with:
          path: .cache
          key: compiler-payload-${{ hashFiles('config/*lock.json') }}
      - run: npm run build
      - run: npm test
        env:
          DEMO_TEST_WORKERS: '8'
      - run: npm run test:game
        env:
          GAME_TEST_TOUCH: '1'
      - run: npm run test:completion
      - run: npm run test:comparison
      - run: npm run test:report
      - run: npm run test:mobile
      - run: npm run test:safari
        env:
          SAFARI_TEST_WORKERS: '2'
      - run: npm run test:safari
        env:
          SAFARI_TEST_MOBILE: '1'
          SAFARI_TEST_WORKERS: '2'
        # Includes worker retirement, isolated linking and byte-for-byte self-build checks.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            build/test-results
            build/game-results
            build/comparison-results
            build/mobile-journey
            build/safari-results
            build/safari-mobile-results
          retention-days: 7
  clang-roundtrip:
    if: github.event_name == 'workflow_dispatch' && inputs.clang_roundtrip
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: .cache
          key: compiler-payload-${{ hashFiles('config/*lock.json') }}
      - run: npm run build
      - run: npm run test:roundtrip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clang-roundtrip-results
          path: build/roundtrip-results
          retention-days: 7

  all-projects:
    if: github.event_name == 'workflow_dispatch' && inputs.all_projects
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: .cache
          key: compiler-payload-${{ hashFiles('config/*lock.json') }}
      - run: npm run build
      - run: npm run test:projects
      - run: npm run test:players
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-project-results
          path: build/project-results
          retention-days: 7
