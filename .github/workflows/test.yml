name: Browser demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      second_build:
        description: Also verify the optional second rebuild
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - run: node tests/highlight_test.mjs
      - run: python3 tests/project_sources_test.py
      - uses: actions/cache@v4
        with:
          path: .cache
          key: compiler-payload-${{ hashFiles('config/artifact-lock.json') }}
      - run: npm run build
      - run: npm test
        env:
          DEMO_TEST_WORKERS: '8'
          DEMO_TEST_SECOND_BUILD: ${{ inputs.second_build && '1' || '0' }}
      - run: npm run test:game
        env:
          GAME_TEST_TOUCH: '1'
      - run: npm run test:mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            build/test-results
            build/game-results
            build/mobile-journey
          retention-days: 7
